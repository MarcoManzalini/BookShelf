<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookShelf</title>
  <meta name="description" content="Il tuo scaffale, sempre con te. Tieni traccia di ogni lettura.">
  <style>
    :root { --bg: #faf8f5; --ink: #18181b; --muted: #6b6b73; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111113; --ink: #f4f4f5; --muted: #a1a1aa; } }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      background: var(--bg); color: var(--ink); padding: 16px;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 40px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>BookShelf</h1>
    <p>Il tuo scaffale, sempre con te. Tieni traccia di ogni lettura.</p>
  </main>
</body>
</html>
